<!DOCTYPE html>
<html>
<head>
    <title>MoodSpace Pro - {% block title %}{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/home.css">
    <link href="https://cdn.jsdelivr.net/npm/chart.js"></link>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo-link">
                <div class="logo">
                    <i class="fas fa-brain"></i>
                    <span>MoodSpace</span>
                </div>
            </a>

            <div class="nav-right">
                <button id="dark-toggle" class="nav-theme-btn" title="Toggle Theme" aria-label="Toggle dark mode">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="mobile-menu-btn" onclick="toggleNavbar()" aria-label="Toggle menu">
                    <i class="fas fa-bars"></i>
                </button>
                <ul class="nav-links" id="navbar">
                    <li><a href="/" class="nav-item">Home</a></li>
                    {% if session.user %}
                    <li><a href="/dashboard" class="nav-item">Feed</a></li>
                    <li><a href="/analyze" class="nav-item">Analyze</a></li>
                    <li><a href="/camera" class="nav-item">Camera</a></li>
                    <li><a href="/journal" class="nav-item">Journal</a></li>
                    <li><a href="/breathe" class="nav-item">Breathe</a></li>
                    <li><a href="/profile" class="nav-item">Profile</a></li>
                    {% if session.user == 'admin' %}
                    <li><a href="/admin" class="nav-item">Admin</a></li>
                    {% endif %}
                    <li><a href="/logout" class="nav-item nav-logout">Logout</a></li>
                    {% else %}
                    <li><a href="/login" class="nav-item nav-cta">Login</a></li>
                    {% endif %}
                </ul>
            </div>
    </nav>

    <main class="page-container">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script src="/static/js/script.js"></script>
</body>
</html>
