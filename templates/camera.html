{% extends "layout.html" %} {% block title %}FaceTime Emotion Scanner -
MoodSpace Pro{% endblock %} {% block content %}
<div class="facetime-camera">
  <div class="camera-header">
    <a href="/dashboard" class="header-left">
      <i class="fas fa-arrow-left"></i>
    </a>
    <h1>Live Emotion Scan</h1>
    <div class="header-right">
      <button id="flip-camera" class="flip-btn" style="display: none">
        <i class="fas fa-sync-alt"></i>
      </button>
    </div>
  </div>

  <div class="camera-container">
    <video id="video" autoplay muted playsinline class="full-camera"></video>
    <canvas id="canvas" style="display: none"></canvas>

    <!-- Real-time emotion badge - top overlay -->
    <div id="emotion-card" class="emotion-badge-live">
      <div class="emotion-icon-live" id="emotion-icon-live">😐</div>
      <div class="emotion-label">
        <span id="emotion-badge">SCANNING</span>
        <span id="confidence-text">92%</span>
      </div>
    </div>
  </div>

  <!-- Capture button -->
  <button id="capture" class="capture-shutter">
    <div class="shutter-inner"></div>
  </button>

  <div class="status-bar" id="camera-status">Live scanning active</div>
</div>

<script src="/static/js/camera.js"></script>
<style>
  .facetime-camera {
    height: 100vh;
    background: linear-gradient(135deg, #0f0f23, #1a1a2e);
    color: white;
    overflow: hidden;
    position: relative;
  }

  .camera-header {
    position: fixed;
    top: 2rem;
    left: 2rem;
    right: 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 100;
    backdrop-filter: blur(20px);
    background: rgba(255, 255, 255, 0.1);
    padding: 1rem 1.5rem;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .header-left i {
    font-size: 1.5rem;
    color: white;
    padding: 1rem;
    border-radius: 50%;
    backdrop-filter: blur(10px);
    transition: all 0.3s;
    cursor: pointer;
  }

  .header-left i:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(1.1);
  }

  .flip-btn {
    background: rgba(255, 255, 255, 0.2);
    border: none;
    padding: 1rem;
    border-radius: 50%;
    color: white;
    cursor: pointer;
    font-size: 1.2rem;
    transition: all 0.3s;
  }

  .flip-btn:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: scale(1.1);
  }

  .camera-main {
    height: 100vh;
    position: relative;
  }

  .camera-container {
    max-width: 500px;
    margin: 0 auto;
    height: 65vh;
  }

  .full-camera {
    width: 100%;
    height: 65vh;
    object-fit: contain;
    background: #000;
    border-radius: 20px;
    transform: scaleX(-1);
  }

  @media (max-width: 768px) {
    .camera-container {
      height: 50vh;
    }

    .full-camera {
      height: 50vh;
      border-radius: 16px;
    }
  }

  .emotion-card-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) translateY(50px);
    opacity: 0;
    transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(30px);
    padding: 2rem;
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    text-align: center;
    min-width: 280px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    z-index: 50;
  }

  .emotion-card-overlay.show {
    transform: translate(-50%, -50%) translateY(0);
    opacity: 1;
  }

  .emotion-badge {
    position: absolute;
    top: -1rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--primary);
    color: white;
    padding: 0.5rem 1.5rem;
    border-radius: 25px;
    font-weight: 700;
    font-size: 0.9rem;
    box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
  }

  .emotion-icon-live {
    font-size: 4rem;
    margin: 1rem 0;
    display: block;
  }

  .confidence {
    font-size: 1.1rem;
    opacity: 0.9;
    font-weight: 500;
  }

  .capture-shutter {
    position: fixed;
    bottom: 4rem;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 4px solid rgba(255, 255, 255, 0.3);
    background: conic-gradient(
      from 0deg at 50% 50%,
      white 0deg,
      white 20deg,
      transparent 20deg,
      transparent 40deg,
      white 40deg,
      white 60deg,
      transparent 60deg,
      transparent 80deg,
      white 80deg 360deg
    );
    cursor: pointer;
    transition: all 0.4s;
    z-index: 300;
    display: block;
  }

  .capture-shutter::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
    transition: all 0.3s;
  }

  .capture-shutter:active::before {
    transform: translate(-50%, -50%) scale(0.8);
    box-shadow: 0 0 0 rgba(255, 255, 255, 0.8);
  }

  .capture-shutter:hover {
    border-color: rgba(255, 255, 255, 0.6);
    transform: translateX(-50%) scale(1.1);
  }

  .status-bar {
    position: fixed;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(20px);
    padding: 0.75rem 2rem;
    border-radius: 25px;
    color: white;
    font-weight: 500;
    z-index: 100;
  }

  @media (max-width: 480px) {
    .camera-main {
      height: 100vh;
    }

    .full-camera {
      object-fit: cover;
    }

    .emotion-card-overlay {
      min-width: 260px;
      padding: 1.5rem;
    }

    .capture-shutter {
      width: 80px;
      height: 80px;
      bottom: 3.5rem;
    }

    .capture-shutter::before {
      width: 55px;
      height: 55px;
    }
  }
</style>
{% endblock %}
