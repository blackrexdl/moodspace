{% extends "layout.html" %} {% block title %}FaceTime Emotion Scanner -
MoodSpace Pro{% endblock %} {% block content %}
<div class="camera-page">
  <!-- Header -->
  <div class="camera-header-premium">
    <a href="/dashboard" class="camera-back">
      <i class="fas fa-arrow-left"></i>
    </a>
    <div class="camera-title">
      <i class="fas fa-video"></i>
      <span>Live Emotion Scan</span>
    </div>
    <div class="camera-status-indicator">
      <span class="status-dot"></span>
      <span class="status-text">Live</span>
    </div>
  </div>

  <!-- Main Camera Area -->
  <div class="camera-viewport">
    <video id="video" autoplay muted playsinline class="camera-video"></video>
    <canvas id="canvas" style="display: none"></canvas>

    <!-- Face Frame Overlay -->
    <div class="face-frame" id="face-frame">
      <div class="face-corner top-left"></div>
      <div class="face-corner top-right"></div>
      <div class="face-corner bottom-left"></div>
      <div class="face-corner bottom-right"></div>
    </div>

    <!-- Real-time Emotion Badge -->
    <div id="emotion-overlay" class="emotion-overlay">
      <div class="emotion-badge-rt" id="emotion-badge-rt">
        <span class="rt-emoji" id="rt-emoji">😐</span>
        <div class="rt-info">
          <span class="rt-label" id="rt-label">Neutral</span>
          <div class="rt-confidence">
            <div class="rt-bar" id="rt-bar"></div>
            <span class="rt-percent" id="rt-percent">85%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Scanning Animation -->
    <div class="scan-line" id="scan-line"></div>
  </div>

  <!-- Expression History -->
  <div class="expression-timeline" id="expression-timeline">
    <div class="timeline-header">
      <i class="fas fa-history"></i>
      <span>Expression Timeline</span>
    </div>
    <div class="timeline-items" id="timeline-items">
      <!-- Items added by JS -->
    </div>
  </div>

  <!-- Controls -->
  <div class="camera-controls">
    <button id="capture" class="shutter-btn">
      <div class="shutter-ring">
        <div class="shutter-core"></div>
      </div>
    </button>
    <p class="capture-hint">Tap to capture emotion</p>
  </div>

  <!-- Status -->
  <div class="camera-status-bar" id="camera-status">
    <i class="fas fa-spinner fa-spin"></i>
    Initializing camera...
  </div>
</div>

<script src="/static/js/camera.js"></script>
{% endblock %}
